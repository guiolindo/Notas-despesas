[build]
builder = "nixpacks"

[deploy]
# NOTA: railway.toml startCommand nao roda em shell — precisa envolver
# em sh -c para expandir $PORT. Ver diagnostico deploy set/2026.
startCommand = "sh -c 'gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --preload --timeout 60 --graceful-timeout 30'"
healthcheckPath = "/health/ready"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
