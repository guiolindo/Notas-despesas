<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha - Economart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-page" data-page="forgot-password">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/img/logo.png" alt="Economart" class="login-logo-img">
      </div>
      <h1 class="login-title">Esqueci minha senha</h1>
      <p class="login-subtitle">Informe seu email para receber um codigo de redefinicao.</p>
      <form id="forgot-password-form">
        <div class="form-group">
          <label for="forgot-email">Email cadastrado</label>
          <input type="email" id="forgot-email" class="form-input" required autocomplete="email">
        </div>
        <div id="forgot-message" class="alert alert-success hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">Enviar codigo</button>
        <p style="text-align:center;margin-top:1rem">
          <a href="/login" class="text-muted">Voltar ao login</a>
          &nbsp;|&nbsp;
          <a href="/reset-password" class="text-muted">Ja tenho um codigo</a>
        </p>
      </form>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
