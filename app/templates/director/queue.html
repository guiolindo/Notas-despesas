{% extends "base.html" %}
{% block title %}Fila do Diretor{% endblock %}
{% block page_id %}director-queue{% endblock %}
{% block content %}
<div class="page-header page-header-row">
  <div>
    <h1>Fila de Aprovacao</h1>
    <p class="text-muted">Notas aguardando decisao da diretoria.</p>
  </div>
  <span class="queue-count" id="queue-count">0 pendentes</span>
</div>
<div class="segmented-control" id="director-queue-filter">
  <button class="active" data-mode="pending">Pendentes</button>
  <button data-mode="all">Todas as notas visiveis</button>
</div>
<div id="director-queue-table"></div>
{% endblock %}
