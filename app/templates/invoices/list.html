{% extends "base.html" %}
{% block title %}Notas Fiscais{% endblock %}
{% block page_id %}invoices-list{% endblock %}
{% block nav_invoices %}active{% endblock %}
{% block content %}
<div class="page-header page-header-row">
  <div>
    <h1>Notas Fiscais</h1>
    <p class="text-muted">Acompanhe suas notas e o status de aprovacao.</p>
  </div>
  <a href="/invoices/new" class="btn btn-primary">Nova Nota</a>
</div>

<div class="filter-bar">
  <div class="filter-search">
    <input
      class="form-input"
      id="invoices-search"
      type="search"
      placeholder="Buscar por numero ou descricao (fornecedor/CNPJ se constarem na descricao)..."
      autocomplete="off"
    >
    <span class="filter-count text-muted" id="invoices-count"></span>
  </div>
  <select class="form-input" id="status-filter" title="Status">
    <option value="">Todos os status</option>
    <option value="RASCUNHO">Rascunho</option>
    <option value="AGUARDANDO_GESTOR">Aguardando gestor</option>
    <option value="REPROVADO_GESTOR">Reprovado gestor</option>
    <option value="AGUARDANDO_DIRETOR">Aguardando diretor</option>
    <option value="REPROVADO_DIRETOR">Reprovado diretor</option>
    <option value="APROVADO">Aprovado</option>
    <option value="PAGO">Lancado</option>
  </select>
  <button class="btn btn-ghost btn-sm" type="button" id="invoices-toggle-advanced">Mais filtros</button>
</div>

<div class="filter-advanced hidden" id="invoices-advanced">
  <div class="form-group">
    <label for="invoices-from-date">Emissao a partir de</label>
    <input class="form-input" id="invoices-from-date" type="date">
  </div>
  <div class="form-group">
    <label for="invoices-to-date">Emissao ate</label>
    <input class="form-input" id="invoices-to-date" type="date">
  </div>
  <div class="form-group">
    <label for="invoices-min-amount">Valor minimo (R$)</label>
    <input class="form-input" id="invoices-min-amount" type="number" min="0" step="0.01" placeholder="0,00">
  </div>
  <div class="form-group">
    <label for="invoices-max-amount">Valor maximo (R$)</label>
    <input class="form-input" id="invoices-max-amount" type="number" min="0" step="0.01" placeholder="0,00">
  </div>
  <div class="form-group">
    <label for="invoices-created-by">Responsavel (criador)</label>
    <input class="form-input" id="invoices-created-by" type="text" placeholder="Nome do colaborador">
  </div>
  <div class="form-group filter-actions">
    <label>&nbsp;</label>
    <button class="btn btn-ghost btn-sm" type="button" id="invoices-clear-filters">Limpar filtros</button>
  </div>
</div>

<div id="invoices-table"></div>
<div class="pagination">
  <button class="btn btn-ghost btn-sm" id="prev-page">Anterior</button>
  <span id="page-indicator">Pagina 1 de 1</span>
  <button class="btn btn-ghost btn-sm" id="next-page">Proximo</button>
</div>
{% endblock %}
