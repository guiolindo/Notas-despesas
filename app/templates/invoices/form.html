<form class="form-card" id="invoice-form">
  <div class="form-grid">
    <div class="form-group">
      <label for="invoice-number">Numero da nota</label>
      <input type="text" id="invoice-number" class="form-input" required maxlength="50">
    </div>
    <div class="form-group">
      <label for="amount">Valor (R$)</label>
      <input type="number" id="amount" class="form-input" required min="0.01" step="0.01">
    </div>
    <div class="form-group">
      <label for="issue-date">Data de emissao</label>
      <input type="date" id="issue-date" class="form-input" required>
    </div>
    <div class="form-group">
      <label for="due-date">Data de vencimento</label>
      <input type="date" id="due-date" class="form-input" required>
    </div>
    <div class="form-group">
      <label for="supplier-document">CPF ou CNPJ do fornecedor <span class="required-mark">*</span></label>
      <input type="text" id="supplier-document" class="form-input" required maxlength="18" autocomplete="off" placeholder="00.000.000/0000-00 ou 000.000.000-00">
      <p class="field-help" id="supplier-doc-status">Digite para validar e buscar dados.</p>
    </div>
    <div class="form-group" id="supplier-name-group">
      <label for="supplier-name">Nome / Razao social</label>
      <input type="text" id="supplier-name" class="form-input" maxlength="255" placeholder="Sera preenchido apos validar o CNPJ">
      <input type="hidden" id="supplier-legal-name">
    </div>
  </div>
  <div class="form-group">
    <label for="description">Descricao</label>
    <textarea id="description" class="form-input" rows="4" required minlength="10" maxlength="2000"></textarea>
    <p class="field-help"><span id="description-count">0</span>/2000 caracteres</p>
  </div>
  <div class="form-group">
    <label for="bank-details">Dados bancarios <span class="text-muted">(opcional)</span></label>
    <textarea id="bank-details" class="form-input" rows="2" maxlength="500" placeholder="Banco, Agencia, Conta, PIX..."></textarea>
  </div>
  <div class="form-group">
    <label for="invoice-file">Anexos (PDF) <span class="required-mark">*</span></label>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="invoice-file" accept=".pdf,application/pdf" multiple>
      <strong>Arraste ate 5 PDFs aqui</strong>
      <span>ou clique para selecionar (nota fiscal + boletos, comprovantes...)</span>
      <small id="selected-file-name">Nenhum arquivo selecionado</small>
    </div>
    <div class="field-help">Maximo 5 arquivos, 10 MB cada, 25 MB no total.</div>
  </div>

  <!-- Lista de anexos JA existentes (modo edicao) — usuario pode remover individualmente -->
  <div class="form-group hidden" id="existing-attachments-group">
    <label>Anexos atuais</label>
    <div id="existing-attachments-list" class="attachments-list"></div>
  </div>

  <!-- Seleção de diretor (visível apenas para quem vai direto ao diretor) -->
  <div class="form-group" id="director-select-group" style="display:none">
    <label for="director-select">Enviar para o diretor</label>
    <div id="director-list" class="director-list">
      <p class="text-muted">Carregando diretores...</p>
    </div>
    <input type="hidden" id="chosen-director-id">
  </div>

  <div class="form-actions">
    <a href="/invoices" class="btn btn-ghost">Cancelar</a>
    <button type="button" class="btn btn-ghost" id="btn-save-draft">Salvar rascunho</button>
    <button type="submit" class="btn btn-primary" id="invoice-submit-btn">Criar e Enviar</button>
  </div>
</form>
