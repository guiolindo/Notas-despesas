{% extends "base.html" %}
{% block title %}Setores{% endblock %}
{% block page_id %}admin-departments{% endblock %}
{% block content %}
<div class="page-header page-header-row">
  <div>
    <h1>Setores</h1>
    <p class="text-muted">Gerencie os setores da empresa e seus diretores responsaveis.</p>
  </div>
  <button class="btn btn-primary" id="btn-new-dept">+ Novo Setor</button>
</div>

<div id="departments-list" class="card-list"></div>

<!-- Modal criar/editar setor -->
<div id="dept-modal" class="modal-backdrop hidden">
  <div class="modal-box">
    <h2 id="dept-modal-title">Novo Setor</h2>
    <div class="form-group">
      <label for="dept-name">Nome do setor</label>
      <input type="text" id="dept-name" class="form-input" maxlength="120" placeholder="Ex: Marketing, Operacoes...">
    </div>
    <div class="form-group">
      <label for="dept-desc">Descricao <span class="text-muted">(opcional)</span></label>
      <textarea id="dept-desc" class="form-input" rows="2" maxlength="300"></textarea>
    </div>
    <div class="form-group">
      <label>Diretores responsaveis</label>
      <div id="directors-checkboxes" class="checkbox-group"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dept-modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="dept-modal-save">Salvar</button>
    </div>
  </div>
</div>
{% endblock %}
