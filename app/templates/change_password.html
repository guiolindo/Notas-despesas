<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trocar Senha - Economart</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css?v={{ STATIC_VERSION }}">
</head>
<body class="login-page" data-page="change-password">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/img/logo.png" alt="Economart" class="login-logo-img">
      </div>
      <h1 class="login-title">Troca de senha</h1>
      <p class="login-subtitle">Defina uma nova senha para continuar</p>
      <div id="force-change-banner" class="alert-banner alert-warning hidden" style="margin-bottom:1rem">
        Sua senha precisa ser alterada antes de acessar o sistema.
      </div>
      <form id="change-password-form">
        <div class="form-group">
          <label for="current-password">Senha atual</label>
          <input type="password" id="current-password" class="form-input" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="new-password">Nova senha</label>
          <input type="password" id="new-password" class="form-input" required autocomplete="new-password">
          <p class="field-help">Minimo 8 caracteres, com letra e numero.</p>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirmar nova senha</label>
          <input type="password" id="confirm-password" class="form-input" required autocomplete="new-password">
        </div>
        <div id="change-password-error" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="change-password-btn">Alterar senha</button>
      </form>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/static/js/format.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/documents.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/core.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/core-auth.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/core-api.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/core-ui.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/core-network.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/core-keyboard.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/shell.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/password.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/app.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/dispatcher.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
