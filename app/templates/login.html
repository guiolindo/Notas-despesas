<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Economart</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css?v={{ STATIC_VERSION }}">
</head>
<body class="login-page" data-page="login">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/img/logo.png" alt="Economart" class="login-logo-img">
      </div>
      <h1 class="login-title">Acesso ao Sistema</h1>
      <p class="login-subtitle">Gestao de Notas Fiscais</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required placeholder="seu@email.com" class="form-input" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-with-icon">
            <input type="password" id="password" name="password" required placeholder="••••••••" class="form-input" autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar ou ocultar senha">Ver</button>
          </div>
        </div>
        <div id="login-error" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Entrar</button>
        <p style="text-align:center;margin-top:1rem">
          <a href="/forgot-password" class="text-muted">Esqueci minha senha</a>
        </p>
      </form>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/static/js/format.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/documents.js?v={{ STATIC_VERSION }}"></script>
  <script src="/static/js/app.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
