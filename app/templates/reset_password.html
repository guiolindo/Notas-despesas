<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha - Economart</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-page" data-page="reset-password">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/static/img/logo.png" alt="Economart" class="login-logo-img">
      </div>
      <h1 class="login-title">Redefinir senha</h1>
      <p class="login-subtitle">Use o codigo enviado para o seu email.</p>
      <form id="reset-password-form">
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input type="email" id="reset-email" class="form-input" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reset-code">Codigo de 6 digitos</label>
          <input type="text" id="reset-code" class="form-input" maxlength="6" pattern="[0-9]{6}" required style="letter-spacing:6px;text-align:center;font-size:18px">
        </div>
        <div class="form-group">
          <label for="reset-new-password">Nova senha</label>
          <input type="password" id="reset-new-password" class="form-input" required autocomplete="new-password" minlength="8">
          <p class="field-help">Minimo 8 caracteres, com letra e numero.</p>
        </div>
        <div id="reset-error" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">Redefinir senha</button>
        <p style="text-align:center;margin-top:1rem">
          <a href="/login" class="text-muted">Voltar ao login</a>
          &nbsp;|&nbsp;
          <a href="/forgot-password" class="text-muted">Pedir outro codigo</a>
        </p>
      </form>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/password.js"></script>
</body>
</html>
