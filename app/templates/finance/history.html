{% extends "base.html" %}
{% block title %}Historico Financeiro{% endblock %}
{% block page_id %}finance-history{% endblock %}
{% block content %}
<div class="page-header page-header-row">
  <div>
    <h1>Historico Financeiro</h1>
    <p class="text-muted">Consulta de notas aprovadas e lancadas.</p>
  </div>
  <button class="btn btn-ghost" disabled>Exportar</button>
</div>
<div class="form-card finance-history-filters">
  <div class="form-grid">
    <div class="form-group">
      <label for="history-issue-from">Emissao de</label>
      <input type="date" id="history-issue-from" class="form-input">
    </div>
    <div class="form-group">
      <label for="history-issue-to">Emissao ate</label>
      <input type="date" id="history-issue-to" class="form-input">
    </div>
    <div class="form-group">
      <label for="history-due-from">Vencimento de</label>
      <input type="date" id="history-due-from" class="form-input">
    </div>
    <div class="form-group">
      <label for="history-due-to">Vencimento ate</label>
      <input type="date" id="history-due-to" class="form-input">
    </div>
    <div class="form-group">
      <label for="history-status">Status</label>
      <select id="history-status">
        <option value="">Aprovado e Lancado</option>
        <option value="APROVADO">Aprovado</option>
        <option value="PAGO">Lancado</option>
      </select>
    </div>
    <div class="form-group">
      <label for="history-creator">Criador</label>
      <input type="text" id="history-creator" class="form-input" placeholder="Nome do criador">
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" id="history-apply-filter">Filtrar</button>
    <button class="btn btn-ghost" id="history-clear-filter">Limpar</button>
  </div>
</div>
<div class="totalizer" id="finance-history-totalizer">0 notas | Valor total: R$ 0,00</div>
<div id="finance-history-table"></div>
<div class="pagination">
  <button class="btn btn-ghost btn-sm" id="finance-history-prev">Anterior</button>
  <span id="finance-history-page">Pagina 1 de 1</span>
  <button class="btn btn-ghost btn-sm" id="finance-history-next">Proximo</button>
</div>
{% endblock %}
