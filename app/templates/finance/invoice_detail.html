{% extends "base.html" %}
{% block title %}Detalhe Financeiro{% endblock %}
{% block page_id %}finance-detail{% endblock %}
{% block content %}
<div id="invoice-detail" data-invoice-id="{{ invoice_id }}">
  <div class="page-header page-header-row">
    <div>
      <a href="/finance/queue" class="text-muted back-link">&larr; Voltar para lancamentos</a>
      <h1 id="detail-title">Nota Fiscal</h1>
      <p class="text-muted" id="detail-subtitle"></p>
    </div>
    <div id="detail-status"></div>
  </div>

  <!-- Painel de acoes financeiras (imprimir / marcar pago) -->
  <div id="finance-actions" class="finance-actions"></div>

  <div class="detail-layout">
    <!-- Esquerda: dados + timeline -->
    <div class="detail-left">
      <div class="detail-grid" id="detail-grid"></div>
      <div class="section-header"><h2>Trilha de aprovacao</h2></div>
      <div class="timeline" id="invoice-timeline"></div>
    </div>

    <!-- Direita: PDF original inline -->
    <div class="detail-right" id="pdf-panel" style="display:none">
      <div class="pdf-panel-header">
        <span>Documento PDF Original</span>
        <a id="pdf-download-link" class="btn btn-ghost btn-sm" target="_blank">Abrir em nova aba</a>
      </div>
      <iframe id="pdf-iframe" class="pdf-iframe" title="PDF da nota fiscal"></iframe>
    </div>
  </div>
</div>
{% endblock %}
