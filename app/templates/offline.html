<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexao — Economart</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f4f5f7 0%, #e5e7eb 100%);
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p.lead {
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .status.online {
      background: #d1fae5;
      color: #065f46;
    }
    .status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #FF6B00;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: #E55A00; }
    button:active { transform: scale(0.98); }
    button:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }
    small {
      display: block;
      margin-top: 16px;
      color: #9ca3af;
      font-size: 12px;
    }
    .logo {
      width: 64px; height: auto;
      opacity: 0.7;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<main>
  <img src="/static/img/logo.png" alt="Economart" class="logo" onerror="this.style.display='none'">
  <div class="icon">📡</div>
  <h1>Sem conexao</h1>
  <p class="lead">
    Voce esta sem internet no momento. Verifique seu Wi-Fi ou
    dados moveis e tente novamente.
  </p>
  <div class="status" id="conn-status">
    <span class="dot"></span>
    <span id="conn-text">Aguardando conexao...</span>
  </div>
  <button id="retry-btn" type="button">Tentar de novo</button>
  <small>O Economart vai recarregar automaticamente quando a conexao voltar.</small>
</main>

<!--
  Logica em arquivo externo porque a CSP do site nao permite script
  inline (script-src 'self' sem unsafe-inline — protecao XSS critica).
  Arquivo cacheado pelo Service Worker pra que execute offline.
-->
<script src="/static/js/offline.js"></script>
</body>
</html>
